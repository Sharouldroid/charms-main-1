name: charms
description: "A new Flutter project."
publish_to: 'none'

version: 2.1.3+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  http: ^1.2.2
  provider: ^6.1.1
  table_calendar: ^3.1.2
  intl: ^0.19.0
  flutter_speed_dial: ^7.0.0
  get: ^4.6.5
  path: ^1.8.3
  overlay_support: ^2.1.0
  flutter_stripe: ^11.0.0
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  local_auth: ^2.1.6
  pdf: ^3.11.1
  image_picker: ^1.0.0
  google_sign_in: ^6.1.5
  permission_handler: ^11.0.1
  signature: ^5.0.0
  flutter_file_dialog: ^3.0.2
  url_launcher: ^6.3.0
  printing: ^5.13.4

  http_parser: ^4.0.0
  dio: ^5.9.0
  open_file: ^3.2.1
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.3

  country_list_pick: ^1.0.1+6
  intl_phone_field: ^3.2.0
  flutter_local_notifications: ^18.0.1
  camera: ^0.10.5+9
  flutter_image_compress: ^2.1.0
  webview_flutter: ^4.10.0
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/CHARMS_ICON.png"
  web:
    generate: true
    image_path: "assets/images/CHARMS_ICON.png"
    background_color: "#ffffff"
    theme_color: "#0175C2"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/cmslogo.png
    - assets/images/logo/seatrulogo1.png
    - assets/images/logo/seatrulogo2.png
    - assets/images/logo/google.jpg
    - assets/images/poster.jpeg
    - assets/images/cmsQR.jpeg
    - assets/images/sizechart.jpg
    - assets/PARENTAL_CONSENT_LETTER_FOR_UNDERAGE_VOLUNTEER.pdf
    - assets/profilepicture.png
    - assets/images/logo/logoumt.png    
    - assets/images/logo/inos.png      